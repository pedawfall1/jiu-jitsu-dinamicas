<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz - Etapa 2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fcfcfc;
        }
    </style>
    <!-- Carrega as configurações (ID do Wistia) -->
    <script src="../config.js"></script>
</head>
<body class="h-[100dvh] w-full mx-auto bg-[#fcfcfc] overflow-hidden">
  
  <div class="grid grid-rows-[auto_1fr_auto] h-full w-full max-w-[440px] mx-auto p-5 gap-4">
      
      <!-- Cabeçalho -->
      <h1 class="text-center font-extrabold text-[24px] leading-[1.1] tracking-tight text-[#1a1a1a] pt-2">
          Assista ao vídeo para liberar a próxima etapa
      </h1>

      <!-- Player de Vídeo -->
      <div class="w-full h-full min-h-0 flex justify-center items-center">
          <!-- O aspect-[9/16] + h-full + max-w-full garante que ele se ajusta perfeitamente sem vazar o min-h-0 -->
          <div class="h-full aspect-[9/16] max-w-full rounded-2xl overflow-hidden shadow-lg border border-gray-100 bg-black relative" id="video-container">
              <!-- O Wistia vai ser renderizado aqui -->
          </div>
      </div>

      <!-- Botão -->
      <div id="next-step-container" class="w-full opacity-0 transition-opacity duration-700 hidden">
          <button class="bg-[#13b56a] hover:bg-[#10a15d] text-white w-full rounded-full py-4 text-[18px] font-extrabold shadow-lg transition-colors flex items-center justify-center gap-2" onclick="window.navigateQuiz('etapa3')">
              Prosseguir
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
          </button>
      </div>

  </div>

  <!-- Scripts Wistia -->
  <script src="https://fast.wistia.com/assets/external/E-v1.js" async></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Usa o vídeo específico da VSL; cai no vídeo geral se não houver.
        const vslId = window.SITE_CONFIG && (window.SITE_CONFIG.vslMediaId || window.SITE_CONFIG.wistiaMediaId);
        if (vslId) {
            const mediaId = vslId;
            
            // Cria o elemento player do Wistia (sem padding responsivo que quebra a altura)
            const container = document.getElementById("video-container");
            // autoPlay começa sozinho; silentAutoPlay faz iniciar mudo onde o navegador
            // bloqueia autoplay com som (celular/navegador interno), com botão de ativar som.
            container.innerHTML = `
                <div class="wistia_embed wistia_async_${mediaId} seo=true autoPlay=true silentAutoPlay=true" style="height:100%;width:100%">
                    <div class="wistia_swatch" style="height:100%;left:0;opacity:0;overflow:hidden;position:absolute;top:0;transition:opacity 200ms;width:100%;">
                        <img src="https://fast.wistia.com/embed/medias/${mediaId}/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" />
                    </div>
                </div>
            `;
            
            // Fica ouvindo o evento de fim do vídeo para mostrar o botão
            window._wq = window._wq || [];
            _wq.push({ id: mediaId, onReady: function(video) {
                video.bind('end', function() {
                    mostrarBotao();
                });
            }});
        } else {
            console.error("ID do Wistia não encontrado no config.js");
            // Mostra o botão por precaução se der erro no vídeo
            mostrarBotao();
        }
    });

    function mostrarBotao() {
        const container = document.getElementById('next-step-container');
        container.classList.remove('hidden');
        // Pequeno delay pra transição css rodar
        setTimeout(() => {
            container.classList.remove('opacity-0');
        }, 50);
    }
  </script>
</body>
</html>
